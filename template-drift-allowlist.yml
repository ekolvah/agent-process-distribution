# Input data for the self-hosting drift gate introduced by issue #6.
#
# Every entry is intentionally absent from template/ or differs from its rendered
# counterpart. Add a path only with the reason that makes a generated copy wrong.
root_only_paths:
  - path: .copier-answers.yml
    reason: Records this source checkout's selected answers, including Copier metadata.
  - path: .github/workflows/reusable-agent-review.yml
    reason: Publisher-owned reusable workflow; payload ships only its caller.
  - path: .github/workflows/reusable-pr-link.yml
    reason: Publisher-owned reusable workflow; payload ships only its caller.
  - path: .github/workflows/reusable-quality.yml
    reason: Publisher-owned reusable workflow; payload ships only its caller.
  - path: template-drift-allowlist.yml
    reason: Source-specific input data for the future drift gate.
  - path: tests/test_project_bootstrap_template.py
    reason: Exercises this repository's Copier source, not a rendered consumer.
  - path: tests/test_process_activation.py
    reason: Guards this repository's own committed Project settings; a rendered consumer starts unconfigured, so this test has no consumer counterpart.
  - path: tests/conftest.py
    reason: Caches Copier renders for source-repository integration tests.
  - path: tests/test_self_installed_process.py
    reason: Verifies this repository's self-application rather than consumer behavior.
  - path: tests/test_template_drift.py
    reason: Reserved for the root-only drift gate in issue #6.
  - path: docs/adr/0013-template-source-self-hosting.md
    reason: Reserved for the source-sync ADR introduced with the drift gate in issue #6.
  - path: copier.yml
    reason: Defines this repository's Copier source; consumers receive only its rendered payload.
  - path: tests/test_agent_review_outcome.py
    reason: Verifies publisher review-evidence parsing rather than a rendered consumer.
  - path: tests/test_blocking_review_threads.py
    reason: Verifies publisher review-thread enforcement rather than a rendered consumer.
  - path: tests/test_request_codex_review.py
    reason: Verifies publisher Codex-review dispatch rather than a rendered consumer.
  - path: tests/test_reusable_workflows.py
    reason: Verifies publisher-owned reusable workflows rather than consumer callers.
  - path: tests/test_workflow_references.py
    reason: Verifies publisher workflow pins rather than rendered consumer behavior.
expected_difference_paths:
  - path: scripts/project_settings.py
    reason: The source repository records its activated Project IDs; rendered consumers begin unconfigured.

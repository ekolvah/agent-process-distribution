# Input data for the self-hosting drift gate introduced by issue #6.
#
# Every entry is intentionally absent from template/ or differs from its rendered
# counterpart. Add a path only with the reason that makes a generated copy wrong.
root_only_paths:
  - path: .github/workflows/reusable-agent-review.yml
    reason: Publisher-owned reusable workflow; payload ships only its caller.
  - path: .github/workflows/reusable-pr-link.yml
    reason: Publisher-owned reusable workflow; payload ships only its caller.
  - path: .github/workflows/reusable-quality.yml
    reason: Publisher-owned reusable workflow; payload ships only its caller.
  - path: template-drift-allowlist.yml
    reason: Source-specific input data for the future drift gate.
  - path: tests/publisher/test_project_bootstrap_template.py
    reason: Exercises this repository's Copier source, not a rendered consumer.
  - path: tests/publisher/conftest.py
    reason: Caches Copier renders for source-repository integration tests.
  - path: tests/publisher/test_self_installed_process.py
    reason: Verifies this repository's self-application rather than consumer behavior.
  - path: tests/publisher/test_template_drift.py
    reason: Reserved for the root-only drift gate in issue #6.
  - path: docs/adr/0013-template-source-self-hosting.md
    reason: Reserved for the source-sync ADR introduced with the drift gate in issue #6.
  - path: docs/adr/0026-project-attribution-rides-the-telemetry-resource-attributes.md
    reason: Records this repository's own telemetry boundary decision; a consumer would inherit assertions about a tenant and a collector it never measured.
  - path: docs/telemetry-measurement-setup.md
    reason: Describes the owner's host telemetry setup — transport variables, collector, dashboards by UID; a consumer would inherit configuration it does not have.
  - path: docs/adr/0027-owner-host-normalizes-per-task-agent-telemetry.md
    reason: Records the owner's private host telemetry routing and attribution codec; consumers neither inherit nor operate that measurement stack.
  - path: scripts/owner_task_attribution.py
    reason: Owner-only launcher for the private workstation telemetry experiment; it is not an agent-process delivery capability.
  - path: tests/publisher/test_owner_task_attribution.py
    reason: Verifies the owner-only launcher and host diagnostics, not consumer behavior.
  - path: copier.yml
    reason: Defines this repository's Copier source; consumers receive only its rendered payload.
  - path: pyproject.toml
    reason: Configures publisher-only tests; consumers receive process configuration below .agent-process.
  - path: tests/publisher/test_agent_review_outcome.py
    reason: Verifies publisher review-evidence parsing rather than a rendered consumer.
  - path: tests/publisher/test_blocking_review_threads.py
    reason: Verifies publisher review-thread enforcement rather than a rendered consumer.
  - path: tests/publisher/test_request_codex_review.py
    reason: Verifies publisher Codex-review dispatch rather than a rendered consumer.
  - path: tests/publisher/test_reusable_workflows.py
    reason: Verifies publisher-owned reusable workflows rather than consumer callers.
  - path: tests/publisher/test_workflow_references.py
    reason: Verifies publisher workflow pins rather than rendered consumer behavior.
  - path: tests/publisher/test_test_suite_ownership.py
    reason: Verifies the publisher/consumer test-suite split itself (issue #20), not a rendered consumer.
  - path: tests/publisher/test_hooks.py
    reason: Reclassified publisher-only (issue #20) — exercises scripts/hooks.py, byte-static across renders and not owed to consumers as a separate copy.
  - path: tests/publisher/test_codex_hooks.py
    reason: Reclassified publisher-only (issue #20) — exercises scripts/codex_hooks.py, byte-static across renders and not owed to consumers as a separate copy.
  - path: tests/publisher/test_payload_layout.py
    reason: Verifies the single-root payload invariant in the publisher source (issue #55).
  - path: tests/publisher/test_bare_consumer_quality.py
    reason: Integration smoke test against a rendered bare consumer; exercises the publisher's reusable-quality workflow, not a file a consumer receives (issue #55/#57).
  - path: tests/publisher/test_existing_project_installation.py
    reason: Verifies the adoption CLI's ownership invariant in the publisher source (issue #59), not a file a consumer receives.
  - path: tests/publisher/test_deferred_scope.py
    reason: Reclassified publisher-only (issue #64) — exercises scripts/check_orphan_scope.py, open_pr.py, update_pr_body.py, and verify_pr_link.py, byte-static across renders and not owed to consumers as a separate copy.
  - path: tests/publisher/test_delivery_state.py
    reason: Publisher-only (issue #56) — exercises scripts/delivery_state.py and the hooks.py Stop adapter, byte-static across renders and not owed to consumers as a separate copy.
  - path: tests/publisher/test_resolve_review_thread.py
    reason: Publisher-only (issue #77) — exercises scripts/resolve_review_thread.py, byte-static across renders and not owed to consumers as a separate copy.
  - path: tests/publisher/test_existing_project_update.py
    reason: Verifies the adoption CLI's update-path invariants in the publisher source, not a file a consumer receives.
expected_difference_paths:

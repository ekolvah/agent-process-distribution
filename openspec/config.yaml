schema: spec-driven

context: |
  Language: en. Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  This repository publishes an agent development process for GitHub projects worked by
  Claude Code and Codex. Three artifacts, three questions:
  - openspec/specs/<capability>/spec.md — what the process does today (the v1 baseline that v2
    keeps, plus what archived changes add)
  - openspec/changes/<name>/ — what a change adds; archived inside its PR before merge
  - .agent-process/docs/adr/ — why (decisions, alternatives, deletion conditions)
  One planning home: a change lives in the repository whose PR archives it (the delivery
  flow stages `openspec/` and the code in one commit), so no registered store holds a change of
  this repository and no command of the process takes a store flag.
  Specs hold requirements and scenarios only: no rationale, no non-goals, no open questions
  (those go to the ADR or the change's design.md). One scenario per requirement is enough
  when it names the observable outcome. Requirement titles are the identity tests refer to:
  keep them short and stable; a rename is a RENAMED delta plus the test rename in one PR.
  The v2 target is delivered by the changes v2-0 … v2-6, each proposed when its step of
  the tracking issue #107 starts; until they archive, the enforced process is v1
  (.agent-process/docs/architecture/).
  Principles §I–VII (.agent-process/docs/architecture/principles.md) bind every artifact:
  test-first, protocol boundaries, root cause before fix, visible degradation, minimal diff.
  A propose run does not end when the last schema artifact exists: its last step is the
  architect review of the `tasks` rule, and the artifacts are reported ready only once
  openspec/changes/<name>/architect-review.md carries a Verdict that starts with `approve`
  and the change's tracking issue is a Project item in `Planned` with its priority.

rules:
  proposal:
    - >-
      Read the code and prior art before writing; when a scope decision is the person's,
      ask before writing the proposal.
    - >-
      Bug: record the reproduction (the failing test, or the exact observation when a test
      needs project-specific capture) and the root cause under **Why**, before any design.
    - >-
      **Impact** lists every file added, edited and removed; a doc-only PR is separate
      from code.
  tasks:
    - >-
      Group 0 — Delivery start: the verdict of `architect-review.md` is `approve`
      (`grep -q "^approve" openspec/changes/<change>/architect-review.md`; on `rework` no
      delivery task runs: apply the findings, re-review) and the tracking issue is a
      Project item in "Planned" (`gh issue view <N> --json projectItems`, `<N>` being the
      number these tasks carry); when the tasks still read `<N>` (the propose run created
      no issue) or the Status is not "Planned", print `propose run not finished: run its
      tail (the Architect review entry of this rule) first` and stop — nothing is asked
      and nothing is created here →
      `gh issue develop -c <N> --name <change>` from fresh origin/main →
      `python .agent-process/scripts/set_status.py <N> "In Progress"` →
      provenance, one line on the issue:
      `gh issue comment <N> --body "planner: <carrier of the propose run>; implementer:
      <this carrier>"` (Claude or Codex; ask when the planner is unknown).
    - >-
      Group 1 — RED first: write the tests of the scenario → test map, run the test
      runner AGENTS.md declares (it writes the JUnit report there), verify
      `python .agent-process/scripts/check_red.py --report <report path> <node ids>` exits 0,
      commit before any implementation. When the map names no test (docs-only, `skip_specs`,
      a rename), the group is one task that records `no RED: <reason>`.
    - >-
      Implementation groups: one task per scenario, design decision or review finding,
      each with its verify command; every group ends with a commit of its work.
    - >-
      Verify group: `npx -y @fission-ai/openspec@1.13.0 validate --strict --all` and
      `python .agent-process/scripts/ci_check.py` green.
    - >-
      Deliver group, in this order: `git status --short` empty (commit what is left) →
      `python .agent-process/scripts/archive_change.py <change>` (marks its own task,
      archives, commits, pushes — the archive is the head the PR opens on, so the
      reviewed head is the archived one) →
      `gh pr create --title "<change>" --body-file <report>` (change name, the tracking
      issue as a plain reference — no `Closes`: the linked branch closes it on merge —
      the scenario → test map, deferrals) → `python .agent-process/scripts/request_codex_review.py --request <PR>`
      (after the PR and after every push: the `agent-review` check waits for the Codex
      review of the head and runs the Claude review only when none arrives) →
      `python .agent-process/scripts/wait_for_pr.py <PR>` → apply every unresolved thread,
      push, re-request — a `P0`/`P1` thread the push addressed is resolved with
      `python .agent-process/scripts/resolve_review_thread.py --repo <owner/repo> --pr <PR>
      --thread <id>` (`--list` prints the open ones; the resolve re-runs the `agent-review`
      check on the unchanged head, no push); a `P2`/`P3` thread is answered, never resolved
      by the process —, repeat at most three rounds; the fourth leaves the rest to the
      person with a reply. The person merges. The tasks after the archive leave no tick in
      the repository: the change is closed and a pushed tick would move the reviewed head —
      the PR (its checks, threads and merge) is their record. A run interrupted after the
      archive does not re-enter the apply (`openspec status` no longer knows the change):
      it continues with `gh pr view <change>` — open the PR when there is none —
      then the review loop.
    - >-
      End with a `## Scenario → test map` section: every `#### Scenario:` of the spec
      deltas → a named test, or `n/a: <reason>`.
    - >-
      Architect review — after tasks.md is written and before the artifacts are reported
      ready, not a group of tasks.md: the planner invokes the architect review (Claude: the
      `architect-reviewer` subagent; Codex: the planner itself as a self-review, stated in
      the Verdict line), which reviews the proposal, the spec deltas, the design and the
      task list against principles §I–VII (`.agent-process/docs/architecture/principles.md`)
      and writes `openspec/changes/<change>/architect-review.md` with three sections —
      `## Verdict`: a line starting with `approve` or `rework`, plus one line of reasoning;
      `## Findings`: one bullet per finding, `§<principle> · <artifact>:<heading or line> —
      what is wrong → what to change`, or `none`; `## Scenario coverage`: every scenario of
      the spec deltas no test can prove, as `<capability> / <scenario> → n/a: <reason>` with
      the reason tasks.md carries. A simpler design that meets the same scenarios is a
      finding; a scenario missing from the scenario → test map of tasks.md is a finding,
      and so is a Group 1 that names no test without a `no RED: <reason>` task. The review
      points at the artifacts and does not restate them. On `rework` the planner applies
      or answers every finding in the artifact it names and asks to run the review again;
      the propose run ends on `approve` — then the tracking issue: when the change has
      none, ask the person for its priority (High/Medium/Low),
      `gh issue create --title "<change>" --body-file openspec/changes/<change>/proposal.md`
      and `python .agent-process/scripts/set_status.py <N> "Planned" --priority "<the answer>"`,
      then write the number into the change (`sed -i "s/<N>/<number>/g"
      openspec/changes/<change>/tasks.md`: Group 0 is how the implementer of another
      session finds it); when it exists, its number is already in tasks.md, its priority
      is already set, and the call is `python .agent-process/scripts/set_status.py <N>
      "Planned"` alone (Todo → Planned on the board); only then report the artifacts
      ready. Artifact
      status is file existence only: the verdict is the gate, and task 0.1 reads it.

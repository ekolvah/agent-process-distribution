# `contract` points at the canonical section a role owes; `adapters` lists the
# known entry points that satisfy it and `adapter` is the currently selected
# default. Naming a provider is therefore a default, not a restriction.
# `adapter_files` declares the carrier of every entry point, keyed identically to
# `adapters`: a repository path, or an explicit `null` where the carrier is not a
# file (a GitHub Action, a person). A missing key is invalid catalogue data, not a skip.
# `carrier_selection` declares HOW this role's carrier is chosen: `run_route`
# (the human's chat picks it), `ci_failover` (a workflow picks it at run time),
# or `sole` (one carrier). It is declared rather than derived from the
# adapter count, because two alternatives do not imply two providers to choose
# between per run.
# `adapter_routes` maps a run route onto the entry point that runs it, so the
# control plane can name the agent of *this* run instead of the file constant.
# Matching is literal and case-sensitive. A `run_route` role maps every
# adapter to exactly one route, which makes `adapters` derivable from it — kept
# anyway, because `adapter_files` is keyed on it. The other two modes declare an
# explicit `null`: their carrier is route-independent, and a missing key stays a
# failure, exactly as for `adapter_files`.
# `adapter_independence` says whether a carrier reviews a plan it did not write.
# Only `architect_reviewer` declares it, because it is the one role where that
# answer changes what the artifact means: a self-review is stated in the Verdict
# line of `architect-review.md` (the `tasks` rule of `openspec/config.yaml`),
# so it passes the gate while staying visible. Declaring the kind here rather than
# letting the author write it makes the contradiction ("independent" claimed for a
# self-review carrier) impossible to state.
roles:
  # First in the file because it is first in the route: a `bug` issue observes the live
  # system before a plan describes it. Before this entry the `## Evidence` block
  # was a contract obligation with no role behind it — every declared authority stopped
  # short of running a capture, so the section was filled by whoever happened to run.
  discovery:
    contract: ".agent-process/docs/architecture/agent-process.md#planning"
    adapters:
      - "Claude /opsx:propose <change> (reproduction)"
      - "Codex $openspec-propose <change> (reproduction)"
    adapter_files:
      "Claude /opsx:propose <change> (reproduction)": ".claude/commands/opsx/propose.md"
      "Codex $openspec-propose <change> (reproduction)": ".agents/skills/openspec-propose/SKILL.md"
    adapter_routes:
      claude: "Claude /opsx:propose <change> (reproduction)"
      codex: "Codex $openspec-propose <change> (reproduction)"
    carrier_selection: "run_route"
    adapter: "Claude /opsx:propose <change> (reproduction)"
    authority: "May run read-only capture routes and write a captured fixture into the working tree; may not create an implementation branch or change production code."
    entry_evidence: "A bug change whose reproduction is not yet recorded under **Why** of proposal.md."
    completion_evidence: "The reproduction (failing test or exact observation) and the root cause recorded under **Why** of proposal.md, as the `proposal` rule of openspec/config.yaml requires."
    activation: "A bug change whose reproduction is not yet recorded."
    # Two, not one: the contract's `status: failed` branch expects capture-fail → fix
    # access → capture again. A cap of one would escalate that routine retry to a human.
    max_runs: 2
  planner:
    contract: ".agent-process/docs/architecture/agent-process.md#planning"
    adapters:
      - "Claude /opsx:propose <change>"
      - "Codex $openspec-propose <change>"
    adapter_files:
      "Claude /opsx:propose <change>": ".claude/commands/opsx/propose.md"
      "Codex $openspec-propose <change>": ".agents/skills/openspec-propose/SKILL.md"
    adapter_routes:
      claude: "Claude /opsx:propose <change>"
      codex: "Codex $openspec-propose <change>"
    carrier_selection: "run_route"
    adapter: "Claude /opsx:propose <change>"
    authority: "May write the artifacts of openspec/changes/<change>/; may not create an implementation branch or change production code."
    entry_evidence: "The brief of the tracking issue and repository context."
    completion_evidence: "Every artifact of the `spec-driven` schema and `architect-review.md` exist and `openspec validate --strict` passes."
    activation: "The change has no complete artifact set."
    max_runs: 1
  architect_reviewer:
    contract: ".agent-process/docs/architecture/agent-process.md#planning"
    adapters:
      - "Claude architect-reviewer subagent"
      - "Codex $openspec-propose <change> self-review"
    adapter_files:
      "Claude architect-reviewer subagent": "agents/architect-reviewer.md"
      "Codex $openspec-propose <change> self-review": ".agents/skills/openspec-propose/SKILL.md"
    adapter_independence:
      "Claude architect-reviewer subagent": "independent"
      "Codex $openspec-propose <change> self-review": "self"
    adapter_routes:
      claude: "Claude architect-reviewer subagent"
      codex: "Codex $openspec-propose <change> self-review"
    carrier_selection: "run_route"
    adapter: "Claude architect-reviewer subagent"
    authority: "Read-only plan review."
    entry_evidence: "proposal, specs, design and tasks of the change exist."
    completion_evidence: "architect-review.md whose Verdict line starts with `approve`."
    activation: "The change has a task list and no approved review."
    max_runs: 1
  implementer:
    contract: ".agent-process/docs/architecture/agent-process.md#deterministic-delivery-flow"
    adapters:
      - "Codex $openspec-apply-change <change>"
      - "Claude /opsx:apply <change>"
    adapter_files:
      "Codex $openspec-apply-change <change>": ".agents/skills/openspec-apply-change/SKILL.md"
      "Claude /opsx:apply <change>": ".claude/commands/opsx/apply.md"
    adapter_routes:
      claude: "Claude /opsx:apply <change>"
      codex: "Codex $openspec-apply-change <change>"
    carrier_selection: "run_route"
    adapter: "Codex $openspec-apply-change <change>"
    authority: "May create the linked branch, commit, push, and open a PR."
    entry_evidence: "An approved architect-review.md and the task list of the change."
    completion_evidence: "Implementation committed and local CI evidence available."
    activation: "Plan and architecture gate are complete."
    max_runs: 1
  pr_reviewer:
    contract: ".agent-process/docs/architecture/agent-process.md#roles-and-hand-offs"
    adapters:
      - "Codex code review (GitHub integration)"
      - "Claude code-review GitHub Action"
    adapter_files:
      "Codex code review (GitHub integration)": null
      "Claude code-review GitHub Action": null
    adapter_routes: null
    carrier_selection: "ci_failover"
    adapter: "Codex code review (GitHub integration)"
    authority: "The PR author requests Codex with @codex review; Claude may publish fallback review evidence; neither may merge."
    entry_evidence: "Passing deterministic CI and a PR head SHA."
    completion_evidence: "Current-head clean, rework, or blocking outcome marker."
    activation: "One review is required for every new PR head SHA."
    # The router enforces this per-head cap through reviewed_heads; this value
    # describes that contract rather than a repository-wide invocation counter.
    max_runs: 1
  fixer:
    contract: ".agent-process/docs/architecture/agent-process.md#review-gate-verdicts"
    adapters:
      - "Codex $openspec-apply-change <change> review/fix loop"
      - "Claude /opsx:apply <change> review/fix loop"
    adapter_files:
      "Codex $openspec-apply-change <change> review/fix loop": ".agents/skills/openspec-apply-change/SKILL.md"
      "Claude /opsx:apply <change> review/fix loop": ".claude/commands/opsx/apply.md"
    adapter_routes:
      claude: "Claude /opsx:apply <change> review/fix loop"
      codex: "Codex $openspec-apply-change <change> review/fix loop"
    carrier_selection: "run_route"
    adapter: "Codex $openspec-apply-change <change> review/fix loop"
    authority: "May make the minimal correction and push a fixer commit, and may resolve the review thread its correction addresses via resolve_review_thread.py."
    entry_evidence: "Current-head rework or blocking review outcome."
    completion_evidence: "A new head SHA for a fresh PR review, or a resolved BLOCKING thread with no new head when the correction was already pushed."
    activation: "Only after actionable PR-review feedback."
    max_runs: 3
  human_merge:
    contract: ".agent-process/docs/architecture/agent-process.md#review-gate-verdicts"
    adapters:
      - "Human reviewer"
    adapter_files:
      "Human reviewer": null
    adapter_routes: null
    carrier_selection: "sole"
    adapter: "Human reviewer"
    authority: "May approve and merge after all required gates pass."
    entry_evidence: "Current-head clean review and passing required checks."
    completion_evidence: "Human merge decision."
    activation: "Clean delivery, or a visible budget escalation."
    # This terminal hand-off has no automated retry; keep max_runs only for the
    # uniform catalogue contract, not as a router-enforced counter.
    max_runs: 1

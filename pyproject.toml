[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".git", ".venv", "__pycache__", ".ruff_cache"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "BLE", "TRY400",
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "RUF100",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "SLF001"]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[tool.pylint."messages control"]
disable = ["all"]
enable = ["too-many-lines"]

[tool.pylint.format]
max-module-lines = 1000

[tool.pytest.ini_options]
testpaths = ["tests/publisher"]
python_files = ["test_*.py"]
pythonpath = [".agent-process", "."]

[tool.tach]
source_roots = ["."]

[[tool.tach.modules]]
path = "tests.**.test_*"
depends_on = []

name: Quality

# Called by a consumer job named `agent-process`, so the gate's context is
# `agent-process / quality`. No pull_request trigger: the caller is the context
# that branch protection observes. `run:` interpolates only the caller file's
# literal commands, never event data; a check name reaches `run:` only through
# `env`.
on:
  workflow_call:
    inputs:
      setup:
        type: string
        required: false
        default: ""
      test:
        type: string
        required: true
      # Prints the check names as a JSON array; each runs `test --only <name>` in
      # its own job. Without it, `test` runs once.
      checks:
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Require the called workflow commit
        env:
          SHA: ${{ job.workflow_sha }}
        run: |
          if test -z "$SHA"; then
            echo "::error::job.workflow_sha is empty; the trusted checkout would fall back to the PR's ref"
            exit 1
          fi

      - name: Checkout trusted process source
        uses: actions/checkout@v4
        with:
          repository: ekolvah/agent-process-distribution
          ref: ${{ job.workflow_sha }}
          path: trusted

      # A release PR changes only what release-please versions (ADR 0031); the
      # detection runs from the trusted process source, never from the PR's head.
      - name: Detect a release PR
        id: release
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python .agent-process/scripts/release_pr.py
          --repo "${{ github.repository }}"
          --pr "${{ github.event.pull_request.number }}"
          --base-sha ${{ github.event.pull_request.base.sha }}
          --head-sha ${{ github.event.pull_request.head.sha }}

      # GitHub's own link field, read once; nothing of the PR's head is checked out
      # (ADR 0027, v2-2c). A release PR carries no link of its own (ADR 0031).
      - name: Verify the PR links its issue
        if: steps.release.outputs.release != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          linked="$(gh pr view "$PR" --json closingIssuesReferences --jq '.closingIssuesReferences | length')"
          if test "$linked" = "0"; then
            echo "::error::PR $PR links no issue. Link one — \`Closes #N\` in the PR body, or open the PR from the branch of \`gh issue develop -c N --name <branch>\` — then \`gh run rerun $GITHUB_RUN_ID\`."
            exit 1
          fi
          echo "ok: PR $PR links $linked issue(s)"

  plan:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.list.outputs.checks || steps.single.outputs.checks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: List checks
        id: list
        if: inputs.checks != ''
        run: |
          checks="$(${{ inputs.checks }})"
          echo "$checks"
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and test("^[A-Za-z0-9._-]+$"))' <<< "$checks" > /dev/null; then
            echo "::error::The checks command printed no non-empty JSON array of check names."
            exit 1
          fi
          echo "checks=$(jq -c . <<< "$checks")" >> "$GITHUB_OUTPUT"
      - name: One test job
        id: single
        if: inputs.checks == ''
        run: echo 'checks=[""]' >> "$GITHUB_OUTPUT"

  check:
    needs: plan
    name: ${{ matrix.check || 'test' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.plan.outputs.checks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup
        if: inputs.setup != ''
        run: ${{ inputs.setup }}
      - name: Test
        env:
          CHECK: ${{ matrix.check }}
        run: ${{ inputs.test }} ${CHECK:+--only "$CHECK"}

  # The required context. A skipped job reports success, so the gate runs
  # always() and accepts only `success` from every job it needs.
  quality:
    needs: [link, plan, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"

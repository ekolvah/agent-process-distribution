name: Quality

# Called by a consumer job named `agent-process`, so the context is
# `agent-process / quality`. No pull_request trigger: the caller is the context
# that branch protection observes. `run:` interpolates only the caller file's
# literal commands, never event data.
on:
  workflow_call:
    inputs:
      setup:
        type: string
        required: false
        default: ""
      test:
        type: string
        required: true

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      # Same step as reusable-quality.yml: GitHub's own link field, read once,
      # before any checkout (ADR 0027, v2-2c).
      - name: Verify the PR links its issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          linked="$(gh pr view "$PR" --json closingIssuesReferences --jq '.closingIssuesReferences | length')"
          if test "$linked" = "0"; then
            echo "::error::PR $PR links no issue. Link one — \`Closes #N\` in the PR body, or open the PR from the branch of \`gh issue develop -c N --name <branch>\` — then \`gh run rerun $GITHUB_RUN_ID\`."
            exit 1
          fi
          echo "ok: PR $PR links $linked issue(s)"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup
        if: inputs.setup != ''
        run: ${{ inputs.setup }}
      - name: Test
        run: ${{ inputs.test }}

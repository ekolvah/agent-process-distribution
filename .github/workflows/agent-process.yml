name: agent-process

# Publisher caller of quality.yml. The `./` path takes the callee from this
# commit, so the PR that changes quality.yml runs its own version; consumers
# pin `@v<version>` instead. Ruleset `agent-process default branch` requires
# the context `agent-process / quality`. The commands are the repository's
# declaration, .github/agent-process-quality.json.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  agent-process:
    uses: ./.github/workflows/quality.yml

name: agent-process

# Publisher caller of quality.yml. The `./` path takes the callee from this
# commit, so the PR that changes quality.yml runs its own version; consumers
# pin `@v<version>` instead. Not required yet: issue 154 activates the context
# `agent-process / quality`; until then `quality / quality` (ci.yml) gates.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  agent-process:
    uses: ./.github/workflows/quality.yml
    with:
      setup: python -m pip install -r .agent-process/requirements.txt -r .agent-process/requirements-dev.txt
      test: python .agent-process/scripts/ci_check.py

name: Reusable quality

on:
  workflow_call:
    inputs:
      setup:
        description: Optional consumer setup command.
        required: false
        type: string
        default: ""
      test:
        description: Consumer quality command.
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the PR links its issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          linked="$(gh pr view "$PR" --json closingIssuesReferences --jq '.closingIssuesReferences | length')"
          if test "$linked" = "0"; then
            echo "::error::PR $PR links no issue. Link it from the gh issue develop branch or the PR sidebar, then run: gh run rerun $GITHUB_RUN_ID"
            exit 1
          fi
          echo "ok: PR $PR links $linked issue(s)"
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Run consumer setup
        if: inputs.setup != ''
        run: ${{ inputs.setup }}
      - name: Run consumer quality
        run: ${{ inputs.test }}
      - name: Validate OpenSpec
        if: hashFiles('openspec/config.yaml') != ''
        run: npx -y @fission-ai/openspec@1.13.0 validate --strict --all

name: Release Please

# One release PR moves every version place; merging it tags `v<version>` (ADR 0030).
# The token is the person's fine-grained PAT, so the required contexts run on the
# release PR; events created with GITHUB_TOKEN start no workflow. The release PR
# merges itself once its required contexts are green (ADR 0031).
# A created release fast-forwards `stable`, the consumers' marketplace channel.
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # Auto-merge waits for the required contexts; a failure to enable it (the
      # repository disallows auto-merge) fails the run instead of stalling the PR.
      # The step `env` is evaluated even when `if` is false, and `pr` is unset when no
      # PR changed (run 36297738914), so the number is parsed in `run`, not in `env`.
      - name: Enable auto-merge on the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          PR=$(jq -er .number <<< "$PR_JSON")
          gh pr merge --auto --squash "$PR"

      # The consumers' marketplace follows `stable` with auto-update. `force=false` makes the
      # update a fast-forward or a refusal, and a refusal fails the run (#199).
      - name: Move stable to the release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.release.outputs.sha }}
        run: gh api -X PATCH "repos/$GH_REPO/git/refs/heads/stable" -f sha="$SHA" -F force=false

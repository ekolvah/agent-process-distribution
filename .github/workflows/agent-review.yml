name: Agent review

on:
  # Pushes alone. Every event is a required context of its own, so a run
  # started by a review event leaves the `pull_request` context as it was;
  # the fixer re-runs that run after a resolve (ADR 0027, v2-2b).
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  agent-review:
    uses: "ekolvah/agent-process-distribution/.github/workflows/reusable-agent-review.yml@main"
    with:
      codex-timeout-seconds: 600
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

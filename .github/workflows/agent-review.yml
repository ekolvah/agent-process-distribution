name: Agent review

on:
  pull_request:
    types: [opened, synchronize]
  # A new review or a resolve re-runs the check on the unchanged head; the callee
  # runs only its enforcement on these events (ADR 0027, v2-2b).
  pull_request_review:
    types: [submitted]
  pull_request_review_thread:
    types: [resolved, unresolved]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  agent-review:
    uses: "ekolvah/agent-process-distribution/.github/workflows/reusable-agent-review.yml@main"
    with:
      codex-timeout-seconds: 600
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

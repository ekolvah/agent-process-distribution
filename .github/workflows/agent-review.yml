name: Agent review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  agent-review:
    uses: "ekolvah/agent-process-distribution/.github/workflows/reusable-agent-review.yml@731d8f0b3b64744e757bc302a9f2acd2fd59b947"
    with:
      codex-timeout-seconds: 600
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

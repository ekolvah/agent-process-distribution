name: Agent review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  agent-review:
    uses: "ekolvah/agent-process-distribution/.github/workflows/reusable-agent-review.yml@4d079a58c1392d0de4e4a060fa33f8b9f4ebedeb"
    with:
      codex-timeout-seconds: 600
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

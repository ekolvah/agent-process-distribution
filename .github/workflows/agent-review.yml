name: Agent review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  agent-review:
    uses: "ekolvah/agent-process-distribution/.github/workflows/reusable-agent-review.yml@e317c26cbd7ff49cc2452b6e6d658d1d1834c6c1"
    with:
      codex-timeout-seconds: 600
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

name: Reusable agent review

# The caller associates this required check with the PR head. The PR author
# starts the external carrier separately with `@codex review`; this workflow
# only reads the resulting native GitHub review and never writes that command.
on:
  workflow_call:
    inputs:
      codex-timeout-seconds:
        description: Bounded wait for the PR author's requested Codex review.
        required: false
        type: number
        default: 600

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  agent-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch current PR context
        id: pr-context
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            if (!pr.head.sha) throw new Error("GitHub returned a PR without a head SHA");
            core.setOutput("number", String(pr.number));
            core.setOutput("head_sha", pr.head.sha);
      - name: Checkout reviewed PR head
        if: ${{ steps.pr-context.outcome == 'success' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.pr-context.outputs.head_sha }}
      - name: Checkout trusted review source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
      - name: Select trusted review source
        id: review-source
        run: |
          if grep -Fq "STANDARD_REVIEW_PARSER = True" \
            "$GITHUB_WORKSPACE/trusted/scripts/request_codex_review.py" 2>/dev/null; then
            echo "working_directory=trusted" >> "$GITHUB_OUTPUT"
          else
            echo "working_directory=." >> "$GITHUB_OUTPUT"
            echo "::notice::bootstrap fallback: default branch has no owner-requested Codex parser yet"
          fi
      - name: Read owner-requested Codex review
        id: codex-review
        if: ${{ always() && steps.pr-context.outcome == 'success' }}
        working-directory: ${{ steps.review-source.outputs.working_directory }}
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.request_codex_review --repo "${{ github.repository }}"
          --pr "${{ steps.pr-context.outputs.number }}"
          --head-sha "${{ steps.pr-context.outputs.head_sha }}"
          --timeout-seconds "${{ inputs.codex-timeout-seconds }}"
      - name: Publish validated Codex review evidence
        if: ${{ always() && steps.pr-context.outcome == 'success' }}
        working-directory: ${{ steps.review-source.outputs.working_directory }}
        env:
          STRUCTURED_OUTCOME: ${{ steps.codex-review.outputs.payload }}
          REVIEWED_HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
        run: >-
          python -m scripts.check_agent_review_outcome "$STRUCTURED_OUTCOME"
          --publish-summary --reviewed-head-sha "$REVIEWED_HEAD_SHA"
      - name: Enforce Codex review outcome
        if: ${{ always() }}
        working-directory: ${{ steps.review-source.outputs.working_directory }}
        env:
          STRUCTURED_OUTCOME: ${{ steps.codex-review.outputs.payload }}
          LIVE_PR_CONTEXT_STATUS: ${{ steps.pr-context.outcome }}
          REVIEW_PRODUCER: Codex review
        run: >-
          python -m scripts.check_agent_review_outcome "$STRUCTURED_OUTCOME"
          --live-pr-context-status "$LIVE_PR_CONTEXT_STATUS" --producer "$REVIEW_PRODUCER"

_templates_suffix: ".jinja"
_subdirectory: "template"
_answers_file: ".copier-answers.yml"
_exclude:
  - "copier.yml"
  - "__pycache__"
  - "*.pyc"
_message_after_copy: |
  Copied the Layer 0 + Codex Layer 2 agent-process payload; it is inactive
  until its credential preflight and `python scripts/bootstrap_github_project.py`
  succeed (add `--confirm-create` for create mode). Follow
  `docs/architecture/agent-process-installation.md`; it gives the required
  order, exit codes, and remote-write boundary.
  If this project also adopts the Claude adapter, install its plugin only after
  this copier payload: its hooks target scripts/hooks.py from Layer 0.

repo_name:
  type: str
  help: Repository name used in process documentation and generated helpers.
  default: "my-project"

github_project_owner:
  type: str
  help: GitHub user or organisation that will own the process board.
  default: "@me"

github_project_mode:
  type: str
  help: Reuse an existing GitHub Project or create a new one during explicit bootstrap.
  choices:
    Reuse existing Project: "existing"
    Create Project: "create"
  default: "create"

existing_github_project_number:
  type: str
  help: Number of the Project to reuse.
  default: ""
  when: "{{ github_project_mode == 'existing' }}"

github_project_title:
  type: str
  help: Title for a Project created by bootstrap.
  default: "{{ repo_name }} agent process"
  when: "{{ github_project_mode == 'create' }}"

github_repository:
  type: str
  help: GitHub repository to link to the process Project, for example owner/repository.
  default: ""

required_status_contexts:
  type: yaml
  help: Required GitHub branch-protection check contexts, in order.
  # A called workflow reports `<caller job> / <callee job>`, not a bare job key.
  # These names are observed again on the source-repository PR before #7 enables
  # protection; changing them is a breaking process release.
  default: ["quality / quality", "pr-link / pr-link", "agent-review / agent-review"]

agent_review_context:
  type: str
  help: Required-context name produced by the automated PR review workflow.
  default: "agent-review / agent-review"

workflow_references:
  type: yaml
  help: Complete reusable-workflow references, pinned to this Copier release (or local self-apply paths).
  default:
    quality: "ekolvah/agent-process-distribution/.github/workflows/reusable-quality.yml@d3f6d238891dbaee6af10b18609e7e07f8901921"
    pr-link: "ekolvah/agent-process-distribution/.github/workflows/reusable-pr-link.yml@d3f6d238891dbaee6af10b18609e7e07f8901921"
    agent-review: "ekolvah/agent-process-distribution/.github/workflows/reusable-agent-review.yml@7cbf0371f13cf6c1f8d76db4706059b191a1f4b1"

not_required_contexts:
  type: yaml
  help: Mapping of deliberately non-required check contexts to their reasons.
  default: {}

ci_checks:
  type: yaml
  help: Ordered CHECKS registry entries, each with name and existing function.
  default:
    - {name: "format", function: "check_format"}
    - {name: "lint", function: "check_lint"}
    - {name: "secrets", function: "check_secrets"}
    - {name: "pytest", function: "check_pytest"}
    - {name: "pip-audit", function: "check_pip_audit"}
    - {name: "pip-audit-dev", function: "check_pip_audit_dev"}
    - {name: "requirements", function: "check_requirements"}

fixture_routes:
  type: yaml
  help: Read-only external-fixture routes this project supports.
  default: ["stdin", "github"]

claude_adapter_installed:
  type: bool
  help: Include Layer 1 .claude files, including its deny-list and PreToolUse/PostToolUse hooks that run on every Bash, Read, Edit, and Write call.
  default: false

doc_guard_excluded_prefixes:
  type: yaml
  help: Repository-relative prefixes excluded from document guards for source-only material.
  default: []
